services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - skillbridge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skillbridge-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - skillbridge-network

networks:
  skillbridge-network:
    driver: bridge
