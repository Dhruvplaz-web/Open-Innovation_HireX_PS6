services:
  # HireX FastAPI ML Backend Engine
  - type: web
    name: hirex-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0

  # HireX React / Vite Frontend SPA
  - type: web
    name: hirex-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: hirex-backend
          envVarKey: RENDER_EXTERNAL_URL

