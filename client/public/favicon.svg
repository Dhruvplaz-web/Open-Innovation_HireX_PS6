<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hx_bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hx_g1" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="hx_g2" x1="52" y1="12" x2="12" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#hx_bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#hx_g1)" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- Stylized geometric X with hiring precision notches -->
  <path d="M18 16L46 48" stroke="url(#hx_g1)" stroke-width="7" stroke-linecap="round"/>
  <path d="M46 16L18 48" stroke="url(#hx_g2)" stroke-width="7" stroke-linecap="round"/>
  <!-- Accent precision target nodes -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="18" cy="16" r="2.5" fill="#38BDF8"/>
  <circle cx="46" cy="48" r="2.5" fill="#06B6D4"/>
  <circle cx="46" cy="16" r="2.5" fill="#818CF8"/>
  <circle cx="18" cy="48" r="2.5" fill="#A855F7"/>
</svg>
