<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="18" fill="#111111"/>
  <!-- Connecting bridge arcs & nodes -->
  <circle cx="20" cy="42" r="5" fill="#818cf8"/>
  <circle cx="44" cy="42" r="5" fill="#f472b6"/>
  <circle cx="32" cy="22" r="6" fill="#ffffff"/>
  <!-- Smooth bridge arch line -->
  <path d="M20 42 C 24 28, 40 28, 44 42" stroke="url(#bridge_grad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M20 42 L 32 22 L 44 42" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="3 3"/>
  <defs>
    <linearGradient id="bridge_grad" x1="20" y1="42" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
</svg>
