<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Slate Monolith Background -->
  <rect width="1200" height="630" fill="#0F172A"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="bridge_linear" x1="500" y1="230" x2="700" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="text_grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="600" cy="200" r="280" fill="#6366F1" fill-opacity="0.12" filter="blur(60px)"/>

  <!-- Bridge Icon Container -->
  <rect x="540" y="110" width="120" height="120" rx="28" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <!-- Connecting bridge arcs & nodes -->
  <circle cx="575" cy="180" r="9" fill="#818CF8"/>
  <circle cx="625" cy="180" r="9" fill="#34D399"/>
  <circle cx="600" cy="145" r="10" fill="#FFFFFF"/>
  <path d="M575 180 C 583 155, 617 155, 625 180" stroke="url(#bridge_linear)" stroke-width="5" stroke-linecap="round"/>
  <path d="M575 180 L 600 145 L 625 180" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Brand Title -->
  <text x="600" y="300" text-anchor="middle" fill="url(#text_grad)" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
    SkillBridge
  </text>

  <!-- Tagline -->
  <text x="600" y="360" text-anchor="middle" fill="#94A3B8" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">
    Bridge Skills to Opportunities
  </text>

  <!-- Pillar Badge / Feature Subtext -->
  <rect x="360" y="420" width="480" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="453" text-anchor="middle" fill="#E2E8F0" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">
    Verified Skills • AI Matching • Career Opportunities
  </text>

  <!-- Subtitle Footer -->
  <text x="600" y="550" text-anchor="middle" fill="#64748B" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="15" font-weight="500">
    Academia-Industry Collaboration &amp; Placement Engine
  </text>
</svg>
